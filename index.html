    <title>ЛАМБРОТИН STACK</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        letter-spacing: -0.011em;
        line-height: 1.6;
        -webkit-user-select: none;
        user-select: none;
        background-color: #f8fafc;
      }
      #root { width: 100vw; height: 100vh; }
      
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.15); }

      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Premium typography adjustments */
      h1, h2, h3, h4, h5, h6 {
        letter-spacing: -0.025em;
        line-height: 1.2;
        font-weight: 800 !important;
      }
      
      button {
        font-weight: 700;
        letter-spacing: 0.05em !important;
        text-transform: uppercase !important;
      }

      /* Ensure links acting as buttons are also uppercase */
      a[role="button"], .btn-action {
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
      }
    </style>
